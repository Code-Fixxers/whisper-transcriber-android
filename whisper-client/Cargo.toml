[package]
name = "whisper-client"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
cdk = { version = "0.8", features = ["wallet"] }
cdk-common = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
